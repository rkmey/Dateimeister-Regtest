[pytest]
; pytest-timeout: auf Windows muss "thread" verwendet werden, "signal" gibt es dort nicht.
; 60 s pro Test ist großzügig. Wenn ein Test hängt, wird er abgebrochen und der Lauf
; geht weiter.
timeout = 60
timeout_method = thread
; Session-Timeout als Notbremse, falls mehrere Tests hintereinander hängen.
session_timeout = 1800

; Ausgabe: kurz und lesbar.
addopts = -v --tb=short

; Log-Datei für den Nachtlauf (wird von run_regtest.cmd zusätzlich gespiegelt).
log_cli = false